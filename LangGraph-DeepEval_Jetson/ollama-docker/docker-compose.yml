
volumes:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: 
    - demo
  restart: unless-stopped
  ports:
    - 11435:11434
  environment:
    - OLLAMA_HOST=0.0.0.0:11434
  volumes:
    - ollama_storage:/root/.ollama
    - /run/jtop.sock:/run/jtop.sock

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: 
    - demo
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
    - /run/jtop.sock:/run/jtop.sock
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11435
  command:
    - "-c"
    - "sleep 3;" # ollama pull llama3.2"

services:
  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks:
      - demo
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    runtime: nvidia
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: 1
    #          capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd
