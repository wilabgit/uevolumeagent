[project]
name = "callback-mcp-server"
version = "1.0.0"
description = "MCP server for 5G Core SMF Event Exposure callbacks with HTTP listener"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
mcp-server = "main:main"
callback-server = "callbackServer:app.run"
start-server = "startServer:main"

[tool.uv]
# UV package manager configuration
managed = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Treat all top-level modules as valid
py-modules = [
    "callbackServer",
    "main",
    "startServer",
    "config",
    "data_store",
    "mcp_tools",
    "test_api"
]
